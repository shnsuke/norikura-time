name: Deploy tt-ftp to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/norikura-climb-predictor-jrcjmj
    paths:
      - 'tt-ftp/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        working-directory: tt-ftp
        run: node --test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tt-ftp
      - id: deployment
        uses: actions/deploy-pages@v4
