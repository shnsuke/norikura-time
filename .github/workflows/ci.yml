name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: core module (prediction engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run core unit tests
        run: ./gradlew :core:test

  web:
    name: web module (Ktor server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew :web:build

  tt-ftp:
    name: tt-ftp (峠TT FTPプランナー)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run calc.js unit tests
        working-directory: tt-ftp
        run: node --test
      - name: Check zwo/ is up to date with menus.json
        working-directory: tt-ftp
        run: |
          node tools/export-zwo.js
          git diff --exit-code -- zwo || (echo "zwo/ が menus.json と一致しません。node tools/export-zwo.js を実行してコミットしてください" && exit 1)
          test -z "$(git status --porcelain -- zwo)"
