<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>乗鞍ヒルクライム タイム予測</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5;
    --fg: #1a1a1a;
    --card: #ffffff;
    --border: #ddd;
    --accent: #0d6b52;
    --muted: #666;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181c;
      --fg: #e8e8e6;
      --card: #1f2226;
      --border: #33383e;
      --accent: #4fd1a5;
      --muted: #9aa0a6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif;
    padding: 24px 16px 64px;
  }
  main { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  p.lead { color: var(--muted); margin-top: 0; font-size: 0.9rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-top: 16px;
  }
  label { display: block; font-size: 0.85rem; margin: 12px 0 4px; color: var(--muted); }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg);
    font-size: 1rem;
  }
  fieldset { border: 1px solid var(--border); border-radius: 8px; margin-top: 16px; }
  legend { padding: 0 6px; font-size: 0.85rem; color: var(--muted); }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #06251c;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #error { color: #d64545; margin-top: 12px; white-space: pre-wrap; }
  #result { margin-top: 16px; }
  .total-time { font-size: 1.6rem; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>乗鞍ヒルクライム タイム予測</h1>
  <p class="lead">体重・FTPとコースプロフィールから、物理モデルで完走タイムを予測します。</p>

  <form class="card" id="predict-form">
    <label for="weightKg">体重 (kg)</label>
    <input id="weightKg" name="weightKg" type="number" step="0.1" min="1" required placeholder="例: 65.0" />

    <label for="bikeWeightKg">自転車・装備重量 (kg)</label>
    <input id="bikeWeightKg" name="bikeWeightKg" type="number" step="0.1" min="0" value="8.0" />

    <fieldset>
      <legend>FTP</legend>
      <label for="ftpWatts">FTP (W) を直接入力する場合</label>
      <input id="ftpWatts" name="ftpWatts" type="number" step="1" min="1" placeholder="例: 220" />

      <label for="athleteId">または intervals.icu から取得 — Athlete ID</label>
      <input id="athleteId" name="athleteId" type="text" placeholder="例: i123456" />

      <label for="apiKey">intervals.icu API Key</label>
      <input id="apiKey" name="apiKey" type="password" placeholder="Settings &gt; Developer Settings で発行" />
    </fieldset>

    <button type="submit" id="submit-btn">予測する</button>
  </form>

  <div id="error" hidden></div>

  <div class="card" id="result" hidden>
    <div class="total-time" id="total-time"></div>
    <div id="summary"></div>
    <table>
      <thead>
        <tr><th>区間</th><th>距離</th><th>勾配</th><th>目標W</th><th>タイム</th></tr>
      </thead>
      <tbody id="segments-body"></tbody>
    </table>
  </div>
</main>

<script>
function formatDuration(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = Math.floor(totalSeconds % 60);
  return h > 0 ? `${h}時間${m}分${s}秒` : `${m}分${s}秒`;
}

const form = document.getElementById('predict-form');
const errorEl = document.getElementById('error');
const resultEl = document.getElementById('result');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.hidden = true;
  resultEl.hidden = true;
  submitBtn.disabled = true;
  submitBtn.textContent = '計算中...';

  const data = new FormData(form);
  const weightKg = parseFloat(data.get('weightKg'));
  const bikeWeightKg = parseFloat(data.get('bikeWeightKg'));
  const ftpRaw = data.get('ftpWatts');
  const athleteId = data.get('athleteId');
  const apiKey = data.get('apiKey');

  const body = { weightKg, bikeWeightKg: isNaN(bikeWeightKg) ? undefined : bikeWeightKg };
  if (ftpRaw) {
    body.ftpWatts = parseInt(ftpRaw, 10);
  } else {
    body.athleteId = athleteId || undefined;
    body.apiKey = apiKey || undefined;
  }

  try {
    const res = await fetch('/api/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const json = await res.json();
    if (!res.ok) {
      throw new Error(json.error || `HTTP ${res.status}`);
    }

    document.getElementById('total-time').textContent =
      '予測合計タイム: ' + formatDuration(json.totalTimeSeconds);
    document.getElementById('summary').textContent =
      `体重 ${json.weightKg.toFixed(1)}kg / FTP ${json.ftpWatts}W / ` +
      `${json.wattsPerKg.toFixed(2)} W/kg / 平均出力目安 ${json.averagePowerWatts.toFixed(0)}W`;

    const tbody = document.getElementById('segments-body');
    tbody.innerHTML = '';
    for (const seg of json.segments) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${seg.name}</td>
        <td>${seg.distanceKm.toFixed(1)}km</td>
        <td>${seg.averageGradientPercent.toFixed(1)}%</td>
        <td>${seg.targetPowerWatts.toFixed(0)}W</td>
        <td>${formatDuration(seg.timeSeconds)}</td>
      `;
      tbody.appendChild(tr);
    }
    resultEl.hidden = false;
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.hidden = false;
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '予測する';
  }
});
</script>
</body>
</html>
